name: Rust release

on:
  workflow_call:
    inputs:
      publish-args:
        description: >-
          Args appended to `cargo publish`, e.g. "--features binary,gpu" or
          "--no-verify". Empty for a crate with no optional functionality.
        type: string
        default: ''
      needs-r:
        description: >-
          Crate links against R via extendr, so the publish verification build
          needs R and the shared libR present.
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 30

jobs:
  release:
    name: Check version and release
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Section aware, so a [workspace.package] or a dependency table cannot
      # shadow the real [package] fields.
      - name: Read name and version from Cargo.toml
        id: pkg
        run: |
          name=$(awk -F'"' '/^\[/{s=$0} s=="[package]" && /^name *=/{print $2; exit}' Cargo.toml)
          version=$(awk -F'"' '/^\[/{s=$0} s=="[package]" && /^version *=/{print $2; exit}' Cargo.toml)
          if [ -z "$name" ] || [ -z "$version" ]; then
            echo "::error::could not read name/version from [package] in Cargo.toml"
            exit 1
          fi
          {
            echo "name=$name"
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether the tag exists
        id: tag
        env:
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Yanked versions still return 200 here, which is what we want: a yank
      # must never trigger a republish of the same number. Anything that is
      # neither 200 nor 404 fails the job rather than being guessed at.
      - name: Check whether the version is on crates.io
        id: crate
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          url="https://crates.io/api/v1/crates/$NAME/$VERSION"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: personal-actions (github.com/GregorLueg/personal-actions)' \
            --retry 3 --retry-delay 5 --retry-connrefused "$url")
          case "$code" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "$NAME $VERSION is already on crates.io"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io returned $code for $url"
              exit 1
              ;;
          esac

      - name: Create and push the tag
        id: push-tag
        if: steps.tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create the GitHub release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: Release ${{ steps.pkg.outputs.tag }}
          generate_release_notes: true

      - name: Install Rust
        if: steps.crate.outputs.published == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Install R
        id: setup-r
        if: steps.crate.outputs.published == 'false' && inputs.needs-r
        uses: r-lib/actions/setup-r@v2

      - name: Install R shared library
        if: steps.crate.outputs.published == 'false' && inputs.needs-r
        run: |
          sudo apt-get update -y
          sudo apt-get install -y r-base-dev
          echo "LIBRARY_PATH=/usr/lib/R/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/lib/R/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # Recovery path: the tag was cut by an earlier run, so HEAD may have moved
      # on since. Publish what the release tag actually points at.
      - name: Check out the existing tag before publishing
        if: steps.tag.outputs.exists == 'true' && steps.crate.outputs.published == 'false'
        env:
          TAG: ${{ steps.pkg.outputs.tag }}
        run: git checkout --detach "$TAG"

      - name: Publish to crates.io
        id: publish
        if: steps.crate.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          LD_LIBRARY_PATH: ${{ inputs.needs-r && format('{0}/lib', steps.setup-r.outputs.r-home) || '' }}
        # shellcheck disable=SC2086  # word splitting is the point here
        run: cargo publish ${{ inputs.publish-args }}

      # Publishing is irreversible, so say what happened without making someone
      # read the log for it.
      - name: Summary
        if: always() && steps.pkg.outputs.version != ''
        env:
          SUMMARY: |
            ### ${{ steps.pkg.outputs.name }} ${{ steps.pkg.outputs.version }}

            - tag `${{ steps.pkg.outputs.tag }}`: ${{ steps.tag.outputs.exists == 'true' && 'already existed' || steps.push-tag.outcome }}
            - crates.io: ${{ steps.crate.outputs.published == 'true' && 'already published' || steps.publish.outcome }}
        run: echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
