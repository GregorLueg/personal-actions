name: Rust release

on:
  workflow_call:
    inputs:
      publish-args:
        description: >-
          Args appended to `cargo publish`, e.g. "--features binary,gpu" or
          "--no-verify". Empty for a crate with no optional functionality.
        type: string
        default: ''
      needs-r:
        description: >-
          Crate links against R via extendr, so the publish verification build
          needs R and the shared libR present.
        type: boolean
        default: false

# Triggered by a completed test run, not by a push, so a crate that does not
# build can never be tagged or published. Callers wire this to:
#
#   on:
#     workflow_run:
#       workflows: ["Test the package"]
#       branches: [main]
#       types: [completed]
#     workflow_dispatch:
#
# Publishing is irreversible: crates.io does not allow re-uploading a version.
# Hence the tag-exists check before anything is pushed anywhere.
jobs:
  release:
    name: Check version and release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    permissions:
      contents: write

    steps:
      # Pin to the sha that actually passed. workflow_run otherwise checks out
      # the default branch HEAD, so a push landing mid-run could get itself
      # published off the back of someone else's green test.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Extract version from Cargo.toml
        id: version
        run: |
          version=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ -z "$version" ]; then
            echo "::error::no version field in Cargo.toml"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} already exists, nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create the GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true

      - name: Install Rust
        if: steps.check.outputs.exists == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Install R
        id: setup-r
        if: steps.check.outputs.exists == 'false' && inputs.needs-r
        uses: r-lib/actions/setup-r@v2

      - name: Install R shared library
        if: steps.check.outputs.exists == 'false' && inputs.needs-r
        run: |
          sudo apt-get update -y
          sudo apt-get install -y r-base-dev
          echo "LIBRARY_PATH=/usr/lib/R/lib:$LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/lib/R/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Publish to crates.io
        if: steps.check.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          LD_LIBRARY_PATH: ${{ inputs.needs-r && format('{0}/lib', steps.setup-r.outputs.r-home) || '' }}
        # shellcheck disable=SC2086  # word splitting is the point here
        run: cargo publish ${{ inputs.publish-args }}
