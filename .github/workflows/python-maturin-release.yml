name: Python maturin release

# The maturin sibling of `python-release.yml`. That one runs `uv build`, which
# produces one wheel for whatever runner it lands on. A compiled extension needs
# a wheel per platform, so the build half is a matrix.
#
# It stops at built artefacts. **The upload belongs to the caller**, and has to:
# PyPI's trusted publishing matches the OIDC token's `job_workflow_ref`, which
# for a reusable workflow names this file in this repository, and the publisher
# form has no way to express that (pypi/warehouse#11096). A caller that
# publishes from its own workflow gets a `job_workflow_ref` PyPI can match. See
# the README for the dozen lines that takes.
#
# Same two independent gates as `rust-release.yml`:
#
#   - tag missing         -> create the tag and cut a GitHub release
#   - version not on PyPI -> build the wheels
#
# Nothing links them. A run that dies between them is recoverable by dispatching
# the caller again: the tag half skips and the build half proceeds.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory holding Cargo.toml and pyproject.toml.
        type: string
        default: python
      tag-prefix:
        description: >-
          Prefix for the release tag. `py-v` rather than `v` because the
          bindings usually live inside the crate's own repo, where the crate
          release already owns `v$version`. Two workflows tagging the same name
          is a race with a permanent loser.
        type: string
        default: py-v
      tag:
        description: >-
          Create the tag and cut the GitHub release. Set false together with
          `publish: false` for a pure build rehearsal: the wheel matrix runs
          against the triggering commit and nothing is written anywhere.
        type: boolean
        default: true
      publish:
        description: >-
          Check the index before building, and skip the wheel matrix when the
          version is already there. It does not upload: the caller owns that
          step, see the README. Set false to build unconditionally.
        type: boolean
        default: true
      repository-url:
        description: >-
          Which index the version check consults. Point it at
          https://test.pypi.org/legacy/ for a rehearsal, which skips the check
          entirely since TestPyPI is not a record of what is released.
        type: string
        default: ''
      linux-target:
        description: Rust target for the manylinux wheel.
        type: string
        default: x86_64
      manylinux:
        description: >-
          manylinux tag for the Linux wheel. `auto` lets maturin-action pick the
          oldest container that works, which is what gets the widest install
          base.
        type: string
        default: auto
      maturin-args:
        description: >-
          Args appended to every `maturin build`, e.g. "--no-default-features"
          for a smaller wheel. Applied to the sdist too.
        type: string
        default: ''
      sdist:
        description: >-
          Also build and publish a source distribution. A crate whose bindings
          sit in a subdirectory with a `path` dependency on the parent may not
          produce an sdist that builds; verify with `maturin sdist` and a clean
          install before turning this on.
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 45
    outputs:
      name:
        description: Distribution name from `[project]` in pyproject.toml.
        value: ${{ jobs.version.outputs.name }}
      version:
        description: Version from `[package]` in Cargo.toml.
        value: ${{ jobs.version.outputs.version }}
      tag:
        description: The release tag, prefix included.
        value: ${{ jobs.version.outputs.tag }}
      should-build:
        description: >-
          False when the version is already on the index, in which case nothing
          was built and the caller must not try to publish.
        value: ${{ jobs.version.outputs.should-build }}

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

defaults:
  run:
    shell: bash

jobs:
  # Reads the version, decides both gates, and cuts the tag. Everything
  # downstream keys off its outputs, so nothing gets built for a version that
  # is already out.
  version:
    name: Check version and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    permissions:
      contents: write
    outputs:
      name: ${{ steps.pkg.outputs.name }}
      version: ${{ steps.pkg.outputs.version }}
      tag: ${{ steps.pkg.outputs.tag }}
      # What the build jobs check out. The release tag once there is one, so a
      # tag cut by an earlier run is what gets built even if HEAD has moved on
      # since; the triggering commit otherwise.
      ref: ${{ steps.ref.outputs.ref }}
      should-build: ${{ steps.pypi.outputs.published != 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Two files, not one. The distribution name lives in `[project]` in
      # pyproject.toml and is not the crate name; the version lives in
      # `[package]` in Cargo.toml, because maturin projects declare
      # `dynamic = ["version"]` and read it from there. Both reads are section
      # aware, so a `[tool.*]` or `[dependencies]` table cannot shadow them.
      - name: Read the name and version
        id: pkg
        working-directory: ${{ inputs.working-directory }}
        run: |
          name=$(awk -F'"' '/^\[/{s=$0} s=="[project]" && /^name *=/{print $2; exit}' pyproject.toml)
          version=$(awk -F'"' '/^\[/{s=$0} s=="[package]" && /^version *=/{print $2; exit}' Cargo.toml)
          if [ -z "$name" ]; then
            echo "::error::could not read name from [project] in pyproject.toml"
            exit 1
          fi
          if [ -z "$version" ]; then
            echo "::error::could not read version from [package] in Cargo.toml"
            exit 1
          fi
          {
            echo "name=$name"
            echo "version=$version"
            echo "tag=${{ inputs.tag-prefix }}$version"
          } >> "$GITHUB_OUTPUT"

      - name: Check whether the tag exists
        id: tag
        env:
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # A yanked release still returns 200, which is what we want: a yank must
      # never trigger a republish of the same number. PyPI also refuses to
      # reuse a filename, so a second attempt would fail anyway. Anything that
      # is neither 200 nor 404 fails the job rather than being guessed at.
      # Cheap, and it runs before the wheel matrix. A bad value here used to
      # cost three runners and ten minutes before the upload step rejected it,
      # which is a long way to travel to learn that a text box had the wrong
      # thing pasted into it.
      - name: Validate the repository URL
        if: inputs.repository-url != ''
        env:
          URL: ${{ inputs.repository-url }}
        run: |
          case "$URL" in
            https://*/legacy/|https://*/legacy)
              echo "publishing to $URL"
              ;;
            *)
              echo "::error::repository-url must be an https upload endpoint ending in /legacy/, got '$URL'"
              exit 1
              ;;
          esac

      - name: Check whether the version is on PyPI
        id: pypi
        if: inputs.publish && inputs.repository-url == ''
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          url="https://pypi.org/pypi/$NAME/$VERSION/json"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: personal-actions (github.com/GregorLueg/personal-actions)' \
            --retry 3 --retry-delay 5 --retry-connrefused "$url")
          case "$code" in
            200)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "$NAME $VERSION is already on PyPI"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::PyPI returned $code for $url"
              exit 1
              ;;
          esac

      - name: Create and push the tag
        id: push-tag
        if: inputs.tag && steps.tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create the GitHub release
        if: inputs.tag && steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: Release ${{ steps.pkg.outputs.tag }}
          generate_release_notes: true

      - name: Decide what the build jobs check out
        id: ref
        env:
          TAG: ${{ steps.pkg.outputs.tag }}
          EXISTED: ${{ steps.tag.outputs.exists }}
          PUSHED: ${{ steps.push-tag.outcome }}
          FALLBACK: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$EXISTED" = 'true' ] || [ "$PUSHED" = 'success' ]; then
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$FALLBACK" >> "$GITHUB_OUTPUT"
          fi

  # One wheel per platform. abi3 means a single wheel covers every supported
  # interpreter, so the matrix is platforms only. Whatever the release tag
  # points at is what gets built: the tag may have been cut by an earlier run
  # and HEAD moved on since.
  wheels:
    name: Wheel for ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.should-build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-latest
            target: ${{ inputs.linux-target }}
            manylinux: ${{ inputs.manylinux }}
          - name: macos-arm64
            runner: macos-14
            target: aarch64
            manylinux: auto
          - name: macos-x86_64
            runner: macos-15-intel
            target: x86_64
            manylinux: auto
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.ref }}

      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: ${{ inputs.working-directory }}
          args: --release --out dist ${{ inputs.maturin-args }}
          sccache: true

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: ${{ inputs.working-directory }}/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: version
    if: needs.version.outputs.should-build == 'true' && inputs.sdist
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.ref }}

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          working-directory: ${{ inputs.working-directory }}
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: ${{ inputs.working-directory }}/dist/*.tar.gz
          if-no-files-found: error

  # There is deliberately no publish job here.
  #
  # PyPI's trusted publishing cannot name a reusable workflow: the OIDC token's
  # `job_workflow_ref` would point at this file in this repository, and the
  # publisher form has no way to express that (pypi/warehouse#11096). So the
  # upload has to run in the calling repository's own workflow, where
  # `job_workflow_ref` is the caller and PyPI can match it.
  #
  # This workflow therefore stops at built artefacts named `dist-*`, and
  # exposes `should-build` so the caller knows whether there is anything to
  # upload. See the README for the dozen lines a caller needs.

  # Publishing is irreversible, so say what happened without making someone
  # read the log for it.
  summary:
    name: Summary
    needs: [version, wheels, sdist]
    if: always() && needs.version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          SUMMARY: |
            ### ${{ needs.version.outputs.name }} ${{ needs.version.outputs.version }}

            - tag `${{ needs.version.outputs.tag }}`: ${{ inputs.tag && 'requested' || 'skipped (tag: false)' }}
            - already on PyPI: ${{ needs.version.outputs.should-build == 'true' && 'no' || 'yes, nothing built' }}
            - wheels: ${{ needs.wheels.result }}
            - sdist: ${{ needs.sdist.result }}
            - index checked: ${{ inputs.repository-url || 'https://upload.pypi.org/legacy/' }}
            - upload: the caller's own job, see the README
        run: echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
