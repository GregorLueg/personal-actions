name: Auto tag

on:
  workflow_call:

# Reads Version from DESCRIPTION, tags it if that tag does not already exist and
# cuts a release.
#
# Callers must trigger this from a completed R-CMD-check run, not from a push,
# so a broken package can never be tagged. The guard below enforces it: on any
# other event the job is skipped. See the README for the caller shape.
#
# There is no paths filter on DESCRIPTION and none is needed. The job runs after
# every successful check on the default branch, finds the tag already exists and
# exits in a couple of seconds.
jobs:
  tag:
    name: Tag and release
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    permissions:
      contents: write
    steps:
      # workflow_run checks out the default branch HEAD unless told otherwise.
      # Pin to the sha that actually passed, so a push landing mid-run cannot
      # get itself released off the back of someone else's green check.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Extract version from DESCRIPTION
        id: version
        run: |
          version=$(grep '^Version:' DESCRIPTION | sed 's/^Version:[[:space:]]*//')
          if [ -z "$version" ]; then
            echo "::error::no Version field in DESCRIPTION"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether the tag exists
        id: check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} already exists, nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      # generate_release_notes replaces the phantom steps.release_notes output
      # the hand-copied version referenced in every repo, which always produced
      # an empty release body.
      - name: Create the GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
